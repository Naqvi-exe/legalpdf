<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bates Numbering — LegalPDF</title>
  <meta name="description" content="Apply sequential Bates numbers to a PDF for legal discovery. Processed locally." />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-mark">§</span>LegalPDF</a>
      <nav class="nav" id="nav">
        <a href="tools.html">Tools</a>
        <a href="pricing.html">Pricing</a>
        <a href="faq.html">FAQ</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="tools.html" class="btn btn-primary btn-sm">All Tools</a>
      </nav>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main">
  <a href="tools.html" class="back-link" aria-label="Back to Tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to Tools</a>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <h1 style="font-size: var(--fs-4xl);">Bates Numbering</h1>
        <p>Apply sequential legal page numbers to a PDF for discovery sets.</p>
      </div>

      <div class="tool-panel reveal">
        <div class="tool-dropzone" id="batesDropzone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;margin:0 auto var(--s-4);color:var(--brand);">
            <path d="M4 7V4h16v3M9 20h6M12 4v16"/>
          </svg>
          <p class="tool-dropzone-title">Select a PDF to Bates number</p>
          <p class="tool-dropzone-sub">Single file. Processed locally.</p>
          <input type="file" id="batesInput" accept="application/pdf" hidden />
          <button class="btn btn-primary" onclick="document.getElementById('batesInput').click()">Choose file</button>
        </div>

        <div class="tool-row">
          <div class="tool-field">
            <label for="batesPrefix">Prefix</label>
            <input type="text" id="batesPrefix" placeholder="BATES" value="BATES" />
          </div>
          <div class="tool-field">
            <label for="batesStart">Starting number</label>
            <input type="number" id="batesStart" value="1" min="1" />
          </div>
          <div class="tool-field">
            <label for="batesDigits">Digits</label>
            <input type="number" id="batesDigits" value="6" min="1" max="10" />
          </div>
        </div>

        <div class="tool-status" id="batesStatus"></div>
        <div class="tool-actions">
          <button class="btn btn-primary" id="batesRun" disabled>Apply and download</button>
          <button class="btn btn-ghost" id="batesReset" disabled>Reset</button>
        </div>
      </div>
    </div>
  </section>  </main>



  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© <span id="year">2025</span> LegalPDF. All rights reserved.</span>
        <span><a href="tools.html">Back to tools</a></span>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
